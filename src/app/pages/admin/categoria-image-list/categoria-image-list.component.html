<div class="admin-wrapper">
<mat-accordion multi>

  <mat-expansion-panel>
    <mat-expansion-panel-header>
      <mat-panel-title>
        📝 Crear o Editar Categoría
      </mat-panel-title>
    </mat-expansion-panel-header>

    <form [formGroup]="categoryForm" (ngSubmit)="saveCategory()" class="category-form">
      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>Nombre</mat-label>
          <input matInput formControlName="name" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Tipo de categoría</mat-label>
          <mat-select formControlName="type">
            <mat-option value="promocional">Promocional</mat-option>
            <mat-option value="real">Real</mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <div class="file-upload">
        <label>Imagen</label>
        <input type="file" (change)="onFileSelected($event)" />
        <img *ngIf="imageBase64" [src]="imageBase64" class="preview-image" />
      </div>

      <button mat-raised-button color="primary" type="submit">
        {{ editingId ? 'Actualizar' : 'Crear' }}
      </button>
    </form>
  </mat-expansion-panel>

  <mat-expansion-panel>
    <mat-expansion-panel-header>
      <mat-panel-title>
        📢 Categorías Promocionales
      </mat-panel-title>
    </mat-expansion-panel-header>

    <table mat-table [dataSource]="promotionalCategories" class="mat-elevation-z2 full-width-table">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let c">
          {{ c.name }}
          <mat-chip *ngIf="c.productCount" color="primary" style="margin-left:8px;">{{ c.productCount }}</mat-chip>
        </td>
      </ng-container>

      <ng-container matColumnDef="image">
        <th mat-header-cell *matHeaderCellDef>Imagen</th>
        <td mat-cell *matCellDef="let c"><img [src]="c.image" width="80" /></td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let c">
          <button mat-button color="accent" (click)="editCategory(c)">Editar</button>
          <button mat-button color="warn" (click)="deleteCategory(c.id)">Eliminar</button>
          <button *ngIf="c.hasProducts" mat-button color="primary" (click)="showRelatedProducts(c.id)">Mostrar</button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="['name', 'image', 'actions']"></tr>
      <tr mat-row *matRowDef="let row; columns: ['name', 'image', 'actions'];"></tr>
    </table>

  </mat-expansion-panel>

  <mat-expansion-panel>
    <mat-expansion-panel-header>
      <mat-panel-title>
        📦 Categorías Reales
      </mat-panel-title>
    </mat-expansion-panel-header>

    <table mat-table [dataSource]="realCategories" class="mat-elevation-z2 full-width-table">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let c">
          {{ c.name }}
          <mat-chip *ngIf="c.productCount" color="primary" style="margin-left:8px;">{{ c.productCount }}</mat-chip>
        </td>
      </ng-container>

      <ng-container matColumnDef="image">
        <th mat-header-cell *matHeaderCellDef>Imagen</th>
        <td mat-cell *matCellDef="let c"><img [src]="c.image" width="80" /></td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let c">
          <button mat-button color="accent" (click)="editCategory(c)">Editar</button>
          <button mat-button color="warn" (click)="deleteCategory(c.id)">Eliminar</button>
          <button *ngIf="c.hasProducts" mat-button color="primary" (click)="showRelatedProducts(c.id)">Mostrar</button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="['name', 'image', 'actions']"></tr>
      <tr mat-row *matRowDef="let row; columns: ['name', 'image', 'actions'];"></tr>
    </table>

  </mat-expansion-panel>

</mat-accordion>
</div>
