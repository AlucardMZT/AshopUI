<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #drawer [mode]="isMobile ? 'over' : 'side'" [opened]="!isMobile" class="sidenav">
    <mat-nav-list>
      <a mat-list-item routerLink="account">👤 Mi cuenta</a>
      <a mat-list-item routerLink="orders">📦 Mis pedidos</a>
      <a mat-list-item routerLink="history">🛒 Historial</a>
      <a mat-list-item routerLink="settings">⚙️ Configuración</a>
      <a mat-list-item routerLink="car">🛒 Carrito</a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="content">
    <!-- Mostrar botón hamburguesa solo en móvil -->
    <button *ngIf="isMobile" mat-icon-button (click)="drawer.toggle()" class="menu-toggle">
      <mat-icon>menu</mat-icon>
    </button>

    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
