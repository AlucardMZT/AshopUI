<mat-card class="login-card mat-elevation-z4">
  <h2 class="title">🔐 Recuperar contraseña</h2>
  <p class="subtitle">Ingresa tu correo y te enviaremos un enlace para restablecer tu contraseña.</p>

  <form (ngSubmit)="onSubmit()" #resetForm="ngForm">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Email</mat-label>
      <input matInput type="email" [(ngModel)]="email" name="email" required email>
      <mat-icon matSuffix>email</mat-icon>
    </mat-form-field>

    <button mat-flat-button color="primary" class="submit-btn" [disabled]="resetForm.invalid">
      Enviar enlace
    </button>

    <mat-divider class="divider"></mat-divider>

    <div *ngIf="message" class="feedback success">
      <mat-icon>check_circle</mat-icon> {{ message }}
    </div>
    <div *ngIf="error" class="feedback error">
      <mat-icon>error</mat-icon> {{ error }}
    </div>
  </form>
</mat-card>
