<div class="login-wrapper">
  <mat-card class="login-card">
    <h2 class="login-title">Iniciar sesión en Toxic Nature</h2>

    <form>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput type="email" name="email" [(ngModel)]="email" required>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Contraseña</mat-label>
        <input matInput type="password" name="password" [(ngModel)]="password" required>
      </mat-form-field>

      <button mat-flat-button style="background-color: #ff3bba" class="full-width" (click)="onLogin()">
        Iniciar sesión
      </button>

      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>
    </form>

    <div class="login-links">
      <a routerLink="/forgot-password">¿Olvidaste tu contraseña?</a>
      <span> | </span>
      <a routerLink="/register">¿No tienes cuenta? Regístrate</a>
    </div>
  </mat-card>
</div>
