<div class="payment-container">
  <div class="payment-inner">
    <mat-progress-spinner *ngIf="isLoading" mode="indeterminate" diameter="40" class="spinner-center"></mat-progress-spinner>

    <mat-card class="summary-card mat-elevation-z2">
      <mat-card-title>
        <mat-icon>receipt_long</mat-icon>
        Resumen del pedido
      </mat-card-title>
      <mat-card-content *ngIf="order">
        <mat-list dense>
          <mat-list-item><strong>Número:</strong>&nbsp;{{ order.orderNumber }}</mat-list-item>
          <mat-list-item><strong>Total:</strong>&nbsp;${{ order.total }}</mat-list-item>
          <mat-list-item><strong>Estado:</strong>&nbsp;{{ order.status }}</mat-list-item>
          <mat-list-item><strong>Fecha:</strong>&nbsp;{{ order.createdAt | date: 'short' }}</mat-list-item>
        </mat-list>
      </mat-card-content>
    </mat-card>

    <mat-card class="method-card mat-elevation-z2">
      <mat-card-title>
        <mat-icon color="primary">credit_card</mat-icon> Pagar con tarjeta
      </mat-card-title>
      <mat-card-content>
        <form id="payment-form">
          <div id="card-element" class="card-box"></div>
          <div class="action-right">
            <button mat-flat-button color="primary" type="submit">Pagar ahora</button>
          </div>
        </form>
      </mat-card-content>
    </mat-card>

    <div class="divider-container">
      <div class="divider-line"></div>
      <div class="divider-text">O</div>
      <div class="divider-line"></div>
    </div>

    <mat-card class="method-card mat-elevation-z2">
      <mat-card-title>
        <mat-icon color="accent">account_balance_wallet</mat-icon> Pagar con PayPal
      </mat-card-title>
      <mat-card-content>
        <div id="paypal-button-container" class="paypal-box"></div>
      </mat-card-content>
    </mat-card>

  </div>
</div>
