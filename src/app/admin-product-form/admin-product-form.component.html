
<div class="admin-wrapper">
  <form [formGroup]="productForm" (ngSubmit)="onSubmit()">

    <div class="form-row">
      <mat-form-field appearance="outline" class="form-field">
        <mat-label>Nombre</mat-label>
        <input matInput formControlName="name" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="form-field">
        <mat-label>Descripción</mat-label>
        <input matInput formControlName="description" />
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="outline" class="form-field small">
        <mat-label>Precio</mat-label>
        <input matInput type="number" formControlName="price" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="form-field">
        <mat-label>Categoría</mat-label>
        <mat-select formControlName="categoryId">
          <mat-option *ngFor="let c of categories" [value]="c.id">
            {{ c.name }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <div class="file-upload">
        <label>Imagen</label>
        <input type="file" (change)="onFileSelected($event)" />
      </div>
    </div>

    <div *ngIf="imageBase64" style="margin-top: 1rem;">
      <strong>Vista previa:</strong><br />
      <img [src]="imageBase64" alt="Vista previa" style="max-height: 100px; border: 1px solid #ccc;" />
    </div>

    <!-- ✅ Mueve el botón aquí -->
    <div class="form-actions">
      <button mat-raised-button color="primary" type="submit">
        {{ editingProductId ? 'Actualizar' : 'Crear' }}
      </button>
    </div>

  </form>
  <mat-divider class="divider"></mat-divider>

  <!-- Tabla de productos -->
  <h2>Productos existentes</h2>
  <table mat-table [dataSource]="products" class="mat-elevation-z2 full-width">

    <!-- Nombre -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Nombre </th>
      <td mat-cell *matCellDef="let product"> {{ product.name }} </td>
    </ng-container>

    <!-- Descripción -->
    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef> Descripción </th>
      <td mat-cell *matCellDef="let product"> {{ product.description }} </td>
    </ng-container>

    <!-- Precio -->
    <ng-container matColumnDef="price">
      <th mat-header-cell *matHeaderCellDef> Precio </th>
      <td mat-cell *matCellDef="let product"> ${{ product.price }} </td>
    </ng-container>

    <!-- Acciones -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Acciones </th>
      <td mat-cell *matCellDef="let product">
        <button mat-button color="accent" (click)="editProduct(product)">Editar</button>
        <button mat-button color="warn" (click)="deleteProduct(product.id)">Eliminar</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="['name', 'description', 'price', 'actions']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['name', 'description', 'price', 'actions'];"></tr>
  </table>
</div>
