<div class="catalog-layout">
  <aside class="sidebar">
    <!-- Categorías -->
    <h3>Categorías</h3>
    <ul *ngIf="categories.length > 0; else noCategories">
      <li (click)="filterByCategory(null)" [class.active]="selectedCategoryId === null">Todas</li>
      <li *ngFor="let cat of categories"
          (click)="filterByCategory(cat.id)"
          [class.active]="selectedCategoryId === cat.id">
        {{ cat.name }}
      </li>
    </ul>
    <ng-template #noCategories>
      <p>No hay categorías disponibles.</p>
    </ng-template>
  </aside>

  <!-- PRODUCTOS -->
  <section class="catalog-content">
    <ng-container *ngIf="loading; else loadedContent">
      <div class="spinner-container">
        <mat-spinner diameter="40" color="primary"></mat-spinner>
        <p class="loading-text">Cargando productos, por favor espera...</p>
      </div>
    </ng-container>

    <ng-template #loadedContent>
      <div class="filter-bar">
        <input type="text" placeholder="Buscar producto..." [(ngModel)]="searchTerm" (input)="applyFilters()">
        <input type="number" placeholder="Precio mínimo" [(ngModel)]="minPrice" (input)="applyFilters()">
        <input type="number" placeholder="Precio máximo" [(ngModel)]="maxPrice" (input)="applyFilters()">

        <select [(ngModel)]="sortOrder" (change)="applyFilters()">
          <option value="">Ordenar por precio</option>
          <option value="asc">Precio: menor a mayor</option>
          <option value="desc">Precio: mayor a menor</option>
        </select>

        <button mat-stroked-button class="filter-color" (click)="resetFilters()">Limpiar filtros</button>
      </div>

      <h2 class="section-title">Todos los productos</h2>

      <div class="product-grid">
        <mat-card
          class="product-card"
          *ngFor="let product of paginatedProducts"
          (click)="verDetalle(product.id)"
          style="cursor: pointer;"
        >
          <img mat-card-image [src]="product.image" [alt]="product.name" />
          <mat-card-content>
            <h3>{{ product.name }}</h3>
            <p>{{ product.description }}</p>
            <p class="price">${{ product.price.toFixed(2) }}</p>
          </mat-card-content>
          <mat-card-actions>
            <button
              mat-raised-button
              color="primary"
              (click)="addToCart(product); $event.stopPropagation()"
            >
              Agregar al carrito
            </button>
          </mat-card-actions>
        </mat-card>
      </div>

      <div class="pagination" *ngIf="products.length > productsPerPage">
        <button mat-button (click)="setPage(currentPage - 1)" [disabled]="currentPage === 1">Anterior</button>
        <span>Página {{ currentPage }} de {{ totalPages }}</span>
        <button mat-button (click)="setPage(currentPage + 1)" [disabled]="currentPage === totalPages">Siguiente</button>
      </div>
    </ng-template>
  </section>
</div>
