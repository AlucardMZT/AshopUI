<h2>Todos los pedidos de usuarios</h2>

<mat-form-field appearance="fill" style="width: 200px; margin-bottom: 1rem;">
  <mat-label>Filtrar por estado</mat-label>
  <mat-select [(value)]="selectedStatus" (selectionChange)="filtrar()">
    <mat-option value="ALL">Todos</mat-option>
    <mat-option value="PAGADO">Pagado</mat-option>
    <mat-option value="PENDIENTE">Pendiente</mat-option>
  </mat-select>
</mat-form-field>

<table mat-table [dataSource]="filteredOrders" class="mat-elevation-z2 full-width">

  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef>ID</th>
    <td mat-cell *matCellDef="let order">{{ order.id }}</td>
  </ng-container>

  <ng-container matColumnDef="orderNumber">
    <th mat-header-cell *matHeaderCellDef>Número de Pedido</th>
    <td mat-cell *matCellDef="let order">{{ order.orderNumber }}</td>
  </ng-container>

  <ng-container matColumnDef="nombre">
    <th mat-header-cell *matHeaderCellDef>Nombre</th>
    <td mat-cell *matCellDef="let order">{{ order.nombre }}</td>
  </ng-container>

  <ng-container matColumnDef="telefono">
    <th mat-header-cell *matHeaderCellDef>Teléfono</th>
    <td mat-cell *matCellDef="let order">{{ order.telefono }}</td>
  </ng-container>

  <ng-container matColumnDef="direccion">
    <th mat-header-cell *matHeaderCellDef>Dirección</th>
    <td mat-cell *matCellDef="let order">{{ order.direccion }}</td>
  </ng-container>

  <ng-container matColumnDef="total">
    <th mat-header-cell *matHeaderCellDef>Total</th>
    <td mat-cell *matCellDef="let order">${{ order.total }}</td>
  </ng-container>

  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef>Estado</th>
    <td mat-cell *matCellDef="let order">
      <span [ngClass]="order.status === 'PAGADO' ? 'paid' : 'pending'">
        {{ order.status }}
      </span>
    </td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Acciones</th>
    <td mat-cell *matCellDef="let order">
      <button *ngIf="order.status === 'PENDIENTE'" mat-button color="primary" (click)="marcarComoPagado(order.id)">
        Marcar como pagado
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columns"></tr>
  <tr mat-row *matRowDef="let row; columns: columns;"></tr>
</table>
