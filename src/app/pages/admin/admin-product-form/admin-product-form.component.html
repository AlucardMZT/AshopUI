<div class="admin-wrapper">
  <h3>Create Update Product</h3>
  <form [formGroup]="productForm" (ngSubmit)="onSubmit()">

    <div class="form-row">
      <mat-form-field appearance="outline" class="form-field">
        <mat-label>Nombre</mat-label>
        <input matInput formControlName="name" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="form-field">
        <mat-label>Descripción</mat-label>
        <input matInput formControlName="description" />
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline" class="form-field small">
      <mat-label>Stock</mat-label>
      <input matInput type="number" formControlName="stock" />
    </mat-form-field>

    <div class="form-row">
      <mat-form-field appearance="outline" class="form-field small">
        <mat-label>Precio</mat-label>
        <input matInput type="number" formControlName="price" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="form-field">
        <mat-label>Categoría</mat-label>
        <mat-select formControlName="categoryId">
          <mat-option *ngFor="let c of categories" [value]="c.id">
            {{ c.name }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <div class="file-upload">
        <label>Imagen 1</label>
        <input type="file" (change)="onFileSelected($event, 1)" />
      </div>
      <div class="file-upload">
        <label>Imagen 2</label>
        <input type="file" (change)="onFileSelected($event, 2)" />
      </div>
      <div class="file-upload">
        <label>Imagen 3</label>
        <input type="file" (change)="onFileSelected($event, 3)" />
      </div>
    </div>

    <div style="margin-top: 1rem;" *ngIf="imageBase64_1 || imageBase64_2 || imageBase64_3">
      <strong>Vistas previas:</strong><br />
      <img *ngIf="imageBase64_1" [src]="imageBase64_1" alt="Vista previa 1" style="max-height: 100px; border: 1px solid #ccc; margin-right: 8px;" />
      <img *ngIf="imageBase64_2" [src]="imageBase64_2" alt="Vista previa 2" style="max-height: 100px; border: 1px solid #ccc; margin-right: 8px;" />
      <img *ngIf="imageBase64_3" [src]="imageBase64_3" alt="Vista previa 3" style="max-height: 100px; border: 1px solid #ccc;" />
    </div>
    <!-- ✅ Mueve el botón aquí -->
    <div class="form-actions">
      <button mat-raised-button color="primary" type="submit">
        {{ editingProductId ? 'Actualizar' : 'Crear' }}
      </button>
    </div>

  </form>


  <!-- Tabla de productos -->
  <h2>Productos existentes</h2>
  <table mat-table [dataSource]="products" class="mat-elevation-z2 full-width">

    <!-- Nombre -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Nombre </th>
      <td mat-cell *matCellDef="let product"> {{ product.name }} </td>
    </ng-container>

    <!-- Descripción -->
    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef> Descripción </th>
      <td mat-cell *matCellDef="let product"> {{ product.description }} </td>
    </ng-container>

    <!-- Precio -->
    <ng-container matColumnDef="price">
      <th mat-header-cell *matHeaderCellDef> Precio </th>
      <td mat-cell *matCellDef="let product"> ${{ product.price }} </td>
    </ng-container>

    <ng-container matColumnDef="stock">
      <th mat-header-cell *matHeaderCellDef> Stock </th>
      <td mat-cell *matCellDef="let product"> {{ product.stock }} </td>
    </ng-container>

    <!-- Acciones -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Acciones </th>
      <td mat-cell *matCellDef="let product">
        <button mat-button color="accent" (click)="editProduct(product)">Editar</button>
        <button mat-button color="warn" (click)="deleteProduct(product.id)">Eliminar</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="['name', 'description', 'price', 'stock', 'actions']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['name', 'description', 'price', 'stock', 'actions'];"></tr>
  </table>
</div>
