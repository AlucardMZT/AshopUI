<mat-sidenav-container class="sidenav-container">
  <!-- SIDEBAR -->
  <mat-sidenav #drawer
               [mode]="isMobile ? 'over' : 'side'"
               [opened]="!isMobile"
               class="sidenav">

<!--    &lt;!&ndash; Logo &ndash;&gt;-->
<!--    <div class="sidenav-header">-->
<!--      <mat-icon>shopping_cart</mat-icon>-->
<!--      <span class="logo-title">A-Shop</span>-->
<!--    </div>-->

    <!-- Sección: Cuenta -->
    <div class="sidebar-section">
      <h3 class="section-title"><mat-icon>person</mat-icon> MI CUENTA</h3>
      <a mat-list-item class="menu-link" routerLink="/account" routerLinkActive="active">Mi cuenta</a>
      <a mat-list-item class="menu-link" routerLink="/orders" routerLinkActive="active">Mis pedidos</a>
      <a mat-list-item class="menu-link" routerLink="/history" routerLinkActive="active">Historial</a>
      <a mat-list-item class="menu-link" routerLink="/settings" routerLinkActive="active">Configuración</a>
      <a mat-list-item class="menu-link" routerLink="/car" routerLinkActive="active">Carrito</a>
    </div>
  </mat-sidenav>

  <!-- MAIN CONTENT -->
  <mat-sidenav-content class="main-content">
    <mat-toolbar class="main-toolbar">
      <button *ngIf="isMobile" mat-icon-button (click)="drawer.toggle()">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="toolbar-title">A-Shop</span>
    </mat-toolbar>

    <div class="page-wrapper">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
