<h2 mat-dialog-title>Productos relacionados con: {{ data.categoryName || data.categoryId }}</h2>
<div mat-dialog-content>
  <div *ngIf="loading">Cargando productos...</div>
  <div *ngIf="error">Error al cargar productos.</div>

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z1 full-width-table" *ngIf="!loading && !error">

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Producto</th>
      <td mat-cell *matCellDef="let p">{{ p.name }}</td>
    </ng-container>

    <ng-container matColumnDef="price">
      <th mat-header-cell *matHeaderCellDef>Precio</th>
      <td mat-cell *matCellDef="let p">{{ p.price | currency }}</td>
    </ng-container>

    <ng-container matColumnDef="category">
      <th mat-header-cell *matHeaderCellDef>Categoria</th>
      <td mat-cell *matCellDef="let p">{{ p.category?.name }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let p">
        <button mat-button color="primary" (click)="editProduct(p)">Editar</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <mat-paginator *ngIf="!loading && !error" [pageSize]="10" [pageSizeOptions]="[10,25,50]"></mat-paginator>
</div>
<div mat-dialog-actions align="end">
  <button mat-stroked-button (click)="close()">Cerrar</button>
  <button mat-flat-button color="warn" (click)="dialogRef.close({ force: true })">Forzar eliminación</button>
</div>
