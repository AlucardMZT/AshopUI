<h2>📦 Tus pedidos</h2>

<mat-card class="order-header-card">
  <div class="filter-row">
    <mat-form-field appearance="fill">
      <mat-label>Filtrar por estado</mat-label>
      <mat-select [(value)]="filtroEstado" (selectionChange)="filtrarPedidos()">
        <mat-option value="">Todos</mat-option>
        <mat-option value="PENDIENTE">Pendiente</mat-option>
        <mat-option value="PAID">Pagado</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Buscar pedido</mat-label>
      <input matInput [(ngModel)]="searchTerm" (input)="filtrarPedidos()" placeholder="Buscar por número">
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
  </div>
</mat-card>

<mat-card class="order-table-card">
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

    <!-- Columnas -->
    <ng-container matColumnDef="orderNumber">
      <th mat-header-cell *matHeaderCellDef>Número</th>
      <td mat-cell *matCellDef="let order">#{{ order.orderNumber }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Estado</th>
      <td mat-cell *matCellDef="let order">{{ order.status }}</td>
    </ng-container>

    <ng-container matColumnDef="createdAt">
      <th mat-header-cell *matHeaderCellDef>Fecha</th>
      <td mat-cell *matCellDef="let order">{{ order.createdAt | date:'short' }}</td>
    </ng-container>

    <ng-container matColumnDef="total">
      <th mat-header-cell *matHeaderCellDef>Total</th>
      <td mat-cell *matCellDef="let order">${{ order.total.toFixed(2) }}</td>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let order">
        <button *ngIf="order.status === 'PENDIENTE'" mat-button color="accent" (click)="irAPagar(order.id)">
          Pagar
        </button>
        <button mat-button color="accent" (click)="verPedido(order.orderNumber)">Ver pedido</button>
        <button *ngIf="order?.status === 'PENDIENTE'" mat-button color="warn" (click)="eliminarPedido(order.id)">Eliminar</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons></mat-paginator>
</mat-card>

<p *ngIf="dataSource.data.length === 0" class="empty-msg">No hay pedidos con este filtro.</p>
